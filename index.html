<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px 20px 80px 20px; /* Отступ снизу для статуса */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-y: auto; /* Включаем вертикальную прокрутку */
        }
        .container {
            display: grid;
            /* Адаптивная сетка: карточки будут подстраиваться под размер экрана */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .card {
            background: #121212;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .room-tag {
            font-size: 14px;
            color: #ffaa00; /* Оранжевый цвет для комнаты */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .device-name {
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
        }
        .temp-value {
            font-size: 76px;
            font-weight: bold;
            color: #00ffb3;
            line-height: 1.1;
            margin: 10px 0;
        }
        .humidity-value {
            font-size: 20px;
            color: #00a2ff;
            margin-bottom: 15px;
        }
        .device-id {
            font-size: 11px;
            color: #555555;
            background: #1a1a1a;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            word-break: break-all;
            transition: background 0.2s;
        }
        .device-id:hover {
            background: #333333;
            color: #bbbbbb;
        }
        .status {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            text-align: center;
            font-size: 14px;
            color: #666666;
            border-top: 1px solid #111111;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <div style="font-size: 24px; color: #666; text-align: center; grid-column: 1/-1;">Загрузка данных умного дома...</div>
    </div>
    
    <div class="status" id="last-update">Обновление...</div>

    <script>
        // === НАСТРОЙКИ ===
        const OAUTH_TOKEN = 'y0__wgBEIy1shUY8etKIOTQkpsZMKfvmOUHHExXGskE42mj8yucekhmJ9ii--g'; 
        const UPDATE_INTERVAL = 5 * 60 * 1000; // 5 минут

        async function fetchSmartHomeData() {
            try {
                const response = await fetch('https://api.iot.yandex.net/v1.0/user/info', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${OAUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Ошибка сети или неверный токен');
                
                const data = await response.json();
                renderDashboard(data.devices);
            } catch (error) {
                console.error(error);
                document.getElementById('dashboard').innerHTML = `<div style="color: #ff3333; font-size: 20px; text-align: center; grid-column: 1/-1;">Ошибка: ${error.message}</div>`;
            }
        }

        // Функция для удобного копирования ID при клике
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('ID скопирован в буфер обмена!');
            }).catch(err => {
                console.error('Не удалось скопировать: ', err);
            });
        }

        function renderDashboard(devices) {
            const dashboardEl = document.getElementById('dashboard');
            dashboardEl.innerHTML = ''; 

            // === НАСТРОЙКИ ФИЛЬТРАЦИИ НА ЭКРАНЕ ===
            // Оставить только определенные дома. Например: ['Квартира'] или ['Дача']
            // Если хотите показывать ВСЕ дома, оставьте массив пустым: []
            const FILTER_BY_HOUSEHOLDS = []; 

            // Оставить только конкретные датчики по их ID. 
            // Если хотите показывать ВСЕ датчики, оставьте массив пустым: []
            const FILTER_BY_IDS = []; 

            // 1. Создаем словари для расшифровки ID домов и комнат
            const householdsMap = {};
            const roomsMap = {};

            devices.forEach(device => {
                // Собираем карту Домов (Household ID -> Название дома)
                if (device.household_id && device.household_name) {
                    householdsMap[device.household_id] = device.household_name;
                } else if (device.household && typeof device.household === 'object') {
                    if (device.household.id && device.household.name) {
                        householdsMap[device.household.id] = device.household.name;
                    }
                }

                // Собираем карту Комнат (Room ID -> Название комнаты)
                if (device.room) {
                    if (typeof device.room === 'object' && device.room.id && device.room.name) {
                        roomsMap[device.room.id] = device.room.name;
                    }
                }
                if (device.room_id && device.room_name) {
                    roomsMap[device.room_id] = device.room_name;
                }
            });

            // 2. Базовый фильтр: отбираем только датчики
            let sensors = devices.filter(device => device.type === 'devices.types.sensor');

            // 3. Применяем фильтр по конкретным ID датчиков (если массив не пустой)
            if (FILTER_BY_IDS.length > 0) {
                sensors = sensors.filter(sensor => FILTER_BY_IDS.includes(sensor.id));
            }

            // 4. Генерируем карточки
            let visibleSensorsCount = 0;

            sensors.forEach(sensor => {
                // Расшифровываем название Дома
                let houseName = 'Неизвестный дом';
                if (sensor.household_id) {
                    houseName = householdsMap[sensor.household_id] || 'Дом';
                } else if (sensor.household) {
                    houseName = typeof sensor.household === 'object' ? (sensor.household.name || 'Дом') : (householdsMap[sensor.household] || 'Дом');
                }

                // Применяем фильтр по конкретным Домам (если массив не пустой)
                if (FILTER_BY_HOUSEHOLDS.length > 0 && !FILTER_BY_HOUSEHOLDS.includes(houseName)) {
                    return; // Пропускаем этот датчик, если его дома нет в списке разрешенных
                }

                visibleSensorsCount++;

                // Расшифровываем название Комнаты
                let roomName = 'Без комнаты';
                if (sensor.room) {
                    if (typeof sensor.room === 'object') {
                        roomName = sensor.room.name || 'Без комнаты';
                    } else if (typeof sensor.room === 'string') {
                        roomName = roomsMap[sensor.room] || 'Комната';
                    }
                }

                // Собираем красивую сдвоенную локацию
                const fullLocation = `${houseName.toUpperCase()} • ${roomName.toUpperCase()}`;

                // Ищем показания температуры и влажности
                let temp = '--';
                let humidity = '';

                if (sensor.properties && sensor.properties.length > 0) {
                    sensor.properties.forEach(prop => {
                        if (prop.parameters && prop.parameters.instance === 'temperature') {
                            temp = prop.state ? `${prop.state.value}°` : '--';
                        }
                        if (prop.parameters && prop.parameters.instance === 'humidity') {
                            humidity = prop.state ? `💧 ${prop.state.value}%` : '';
                        }
                    });
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="room-tag">${fullLocation}</div>
                        <div class="device-name">${sensor.name}</div>
                    </div>
                    <div class="temp-value">${temp}</div>
                    <div class="humidity-value">${humidity}</div>
                    <div class="device-id" onclick="copyToClipboard('${sensor.id}')" title="Кликните, чтобы скопировать">ID: ${sensor.id}</div>
                `;
                dashboardEl.appendChild(card);
            });

            if (visibleSensorsCount === 0) {
                dashboardEl.innerHTML = '<div style="color: #888; text-align: center; grid-column: 1/-1;">Датчики для выбранных условий не найдены</div>';
                return;
            }

            const now = new Date();
            document.getElementById('last-update').innerText = `Обновлено: ${now.toLocaleTimeString()}`;
        }

        fetchSmartHomeData();
        setInterval(fetchSmartHomeData, UPDATE_INTERVAL);
    </script>
</body>
</html>
