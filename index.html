<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-y: auto; /* Вертикальный скролл для большого количества датчиков */
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .card {
            background: #121212;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .room-tag {
            font-size: 14px;
            color: #ffaa00; /* Неоново-оранжевый тег локации */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .device-name {
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
        }
        .temp-value {
            font-size: 76px;
            font-weight: bold;
            color: #00ffb3; /* Зеленый цвет для температуры */
            line-height: 1.1;
            margin: 10px 0;
        }
        .humidity-value {
            font-size: 20px;
            color: #00a2ff; /* Синий цвет для влажности */
            margin-bottom: 15px;
        }
        .device-id {
            font-size: 11px;
            color: #555555;
            background: #1a1a1a;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            word-break: break-all;
            transition: background 0.2s;
        }
        .device-id:hover {
            background: #333333;
            color: #bbbbbb;
        }
        .status {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            text-align: center;
            font-size: 14px;
            color: #666666;
            border-top: 1px solid #111111;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <div style="font-size: 24px; color: #666; text-align: center; grid-column: 1/-1;">Загрузка данных умного дома...</div>
    </div>
    
    <div class="status" id="last-update">Обновление...</div>

    <script>
        // Настройки. Интервал обновления.
        const UPDATE_INTERVAL = 1 * 60 * 1000; // 1 минута в миллисекундах

        // === АВТОМАТИЧЕСКОЕ ЧТЕНИЕ НАСТРОЕК ИЗ URL ===
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. Ищем токен сначала в URL (?token=...), а если его там нет — в памяти устройства
        let OAUTH_TOKEN = urlParams.get('token') || localStorage.getItem('yandex_token');

        if (!OAUTH_TOKEN) {
            OAUTH_TOKEN = prompt('Пожалуйста, введите ваш OAuth-токен Яндекса:');
            if (OAUTH_TOKEN) {
                localStorage.setItem('yandex_token', OAUTH_TOKEN);
            } else {
                alert('Без токена дашборд работать не будет!');
            }
        }
                
        // 2. Читаем фильтры из URL-параметров
        // Передавать дома можно через запятую: ?house=Квартира  или  ?house=Квартира,Дача
        const paramHouse = urlParams.get('house');
        const FILTER_BY_HOUSES = paramHouse ? paramHouse.split(',').map(s => s.trim()) : [];

        // Передавать ID датчиков можно через запятую: ?ids=id1,id2,id3
        const paramIds = urlParams.get('ids');
        const FILTER_BY_IDS = paramIds ? paramIds.split(',').map(s => s.trim()) : [];

        // Фукнция чтения данных из API Яндекса и запуска дальнейшей обработки
        // Yandex API endpoint: https://api.iot.yandex.net/v1.0/user/info
        async function fetchSmartHomeData() {
            if (!OAUTH_TOKEN) return;
            try {
                const response = await fetch('https://api.iot.yandex.net/v1.0/user/info', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${OAUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Ошибка сети или неверный токен');
                
                const data = await response.json();

                // Передаем сырые данные Яндекса на обработку и рендеринг
                processAndRender(data);

            } catch (error) {
                console.error(error);
                document.getElementById('dashboard').innerHTML = `<div style="color: #ff3333; font-size: 20px; text-align: center; grid-column: 1/-1;">Ошибка: ${error.message}</div>`;
            }
        }

        // Функция копирования ID датчика кликом
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('ID скопирован в буфер обмена!');
            }).catch(err => {
                console.error('Не удалось скопировать: ', err);
            });
        }

        // Функция разбора данных из API Яндекса и вывода дашборда
        function processAndRender(data) {
            const dashboardEl = document.getElementById('dashboard');
            dashboardEl.innerHTML = ''; 

            // 1. Создаем быстрые словари по эталонной логике Яндекса
            const houseById = {};
            if (data.households) {
                for (const h of data.households) {
                    houseById[h.id] = h.name;
                }
            }

            const roomById = {};
            if (data.rooms) {
                for (const r of data.rooms) {
                    roomById[r.id] = {
                        name: r.name,
                        houseName: houseById[r.household_id] || 'Без дома'
                    };
                }
            }

            if (!data.devices) return;

            // 2. ОТБОР УСТРОЙСТВ: Полностью убираем фильтр типов. 
            // Ищем любые девайсы, у которых внутри свойств (properties) есть климатические данные.
            const sensors = [];

            data.devices.forEach(d => {
                let temperature = null;
                let humidity = null;
                let hasClimateData = false;

                // Проверяем массив свойств (properties)
                for (const p of (d.properties || [])) {
                    if (p.parameters && p.parameters.instance === 'temperature') {
                        temperature = p.state?.value ?? null;
                        hasClimateData = true; // Устройство содержит данные температуры
                    }
                    if (p.parameters && p.parameters.instance === 'humidity') {
                        humidity = p.state?.value ?? null;
                        hasClimateData = true; // Устройство содержит данные влажности
                    }
                }

                // Если устройство умеет измерять климат — забираем его, независимо от его типа в Яндексе
                if (hasClimateData) {
                    // Умное определение комнаты и дома
                    let currentRoomName = 'Без комнаты';
                    let currentHouseName = 'Без дома';

                    if (d.room && roomById[d.room]) {
                        currentRoomName = roomById[d.room].name;
                        currentHouseName = roomById[d.room].houseName;
                    } else {
                        // Если датчик не привязан к комнате или структура сбита, ищем дом напрямую
                        if (d.household_id && houseById[d.household_id]) {
                            currentHouseName = houseById[d.household_id];
                        }
                    }

                    sensors.push({
                        id:          d.id,
                        name:        d.name,
                        roomName:    currentRoomName,
                        houseName:   currentHouseName,
                        temperature: temperature,
                        humidity:    humidity
                    });
                }
            });

            // 3. Применяем ручные фильтры (если массивы в настройках пустые `[]`, они не мешают)
            let filteredSensors = sensors;
            if (typeof FILTER_BY_IDS !== 'undefined' && FILTER_BY_IDS.length > 0) {
                filteredSensors = filteredSensors.filter(s => FILTER_BY_IDS.includes(s.id));
            }
            if (typeof FILTER_BY_HOUSES !== 'undefined' && FILTER_BY_HOUSES.length > 0) {
                filteredSensors = filteredSensors.filter(s => FILTER_BY_HOUSES.includes(s.houseName));
            }

            if (filteredSensors.length === 0) {
                dashboardEl.innerHTML = '<div style="color: #888; text-align: center; grid-column: 1/-1;">Датчики климата не найдены. Проверьте фильтры.</div>';
                return;
            }

            // 4. Отрисовка готовых карточек умного дома
            filteredSensors.forEach(sensor => {
                const fullLocation = `${sensor.houseName} • ${sensor.roomName}`;
                const tempText = sensor.temperature !== null ? `${sensor.temperature}°` : '--';
                const humText = sensor.humidity !== null ? `💧 ${sensor.humidity}%` : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="room-tag">${fullLocation}</div>
                        <div class="device-name">${sensor.name}</div>
                    </div>
                    <div class="temp-value">${tempText}</div>
                    <div class="humidity-value">${humText}</div>
                    <div class="device-id" onclick="copyToClipboard('${sensor.id}')" title="Кликните, чтобы скопировать">ID: ${sensor.id}</div>
                `;
                dashboardEl.appendChild(card);
            });

            const now = new Date();
            document.getElementById('last-update').innerText = `Обновлено: ${now.toLocaleTimeString()}`;
        }

        // Старт работы
        fetchSmartHomeData();
        setInterval(fetchSmartHomeData, UPDATE_INTERVAL);
    </script>
</body>
</html>
