<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
        }
        .card {
            background: #121212;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            flex: 1;
            min-width: 240px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .room-name {
            font-size: 24px;
            color: #888888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .temp-value {
            font-size: 84px;
            font-weight: bold;
            color: #00ffb3; /* Красивый неоново-зеленый цвет для градусов */
            line-height: 1;
            margin: 15px 0;
        }
        .humidity-value {
            font-size: 20px;
            color: #00a2ff; /* Синеватый цвет для влажности */
        }
        .status {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: #444444;
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <!-- Сюда JavaScript сам добавит ваши датчики -->
        <div style="font-size: 24px; color: #666;">Загрузка данных умного дома...</div>
    </div>
    
    <div class="status" id="last-update">Обновление...</div>

    <script>
        // === НАСТРОЙКИ ===
        const OAUTH_TOKEN = 'y0__wgBEIy1shUY8etKIOTQkpsZMKfvmOUHHExXGskE42mj8yucekhmJ9ii--g';
        const UPDATE_INTERVAL = 5 * 60 * 1000; // 5 минут в миллисекундах

        async function fetchSmartHomeData() {
            try {
                const response = await fetch('https://api.iot.yandex.net/v1.0/user/info', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${OAUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Ошибка сети или неверный токен');
                
                const data = await response.json();
                renderDashboard(data.devices);
            } catch (error) {
                console.error(error);
                document.getElementById('dashboard').innerHTML = `<div style="color: #ff3333; font-size: 20px;">Ошибка получения данных: ${error.message}</div>`;
            }
        }

        function renderDashboard(devices) {
            const dashboardEl = document.getElementById('dashboard');
            dashboardEl.innerHTML = ''; // Очищаем контейнер

            // Фильтруем устройства, оставляя только датчики (сенсоры)
            const sensors = devices.filter(device => device.type === 'devices.types.sensor');

            if (sensors.length === 0) {
                dashboardEl.innerHTML = '<div style="color: #888;">Датчики температуры не найдены</div>';
                return;
            }

            sensors.forEach(sensor => {
                let temp = '--';
                let humidity = '';

                // Ищем показания температуры и влажности внутри свойств датчика
                if (sensor.properties && sensor.properties.length > 0) {
                    sensor.properties.forEach(prop => {
                        if (prop.parameters && prop.parameters.instance === 'temperature') {
                            temp = prop.state ? `${prop.state.value}°` : '--';
                        }
                        if (prop.parameters && prop.parameters.instance === 'humidity') {
                            humidity = prop.state ? `💧 Влажность: ${prop.state.value}%` : '';
                        }
                    });
                }

                // Создаем карточку для каждого термометра
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="room-name">${sensor.name}</div>
                    <div class="temp-value">${temp}</div>
                    <div class="humidity-value">${humidity}</div>
                `;
                dashboardEl.appendChild(card);
            });

            // Обновляем время последнего успешного запроса
            const now = new Date();
            document.getElementById('last-update').innerText = `Обновлено: ${now.toLocaleTimeString()}`;
        }

        // Запуск при загрузке страницы
        fetchSmartHomeData();
        
        // Циклический повтор каждые 5 минут
        setInterval(fetchSmartHomeData, UPDATE_INTERVAL);
    </script>
</body>
</html>
