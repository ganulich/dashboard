<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px 20px 80px 20px; /* Отступ снизу для статуса */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-y: auto; /* Включаем вертикальную прокрутку */
        }
        .container {
            display: grid;
            /* Адаптивная сетка: карточки будут подстраиваться под размер экрана */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .card {
            background: #121212;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .room-tag {
            font-size: 14px;
            color: #ffaa00; /* Оранжевый цвет для комнаты */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .device-name {
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
        }
        .temp-value {
            font-size: 76px;
            font-weight: bold;
            color: #00ffb3;
            line-height: 1.1;
            margin: 10px 0;
        }
        .humidity-value {
            font-size: 20px;
            color: #00a2ff;
            margin-bottom: 15px;
        }
        .device-id {
            font-size: 11px;
            color: #555555;
            background: #1a1a1a;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            word-break: break-all;
            transition: background 0.2s;
        }
        .device-id:hover {
            background: #333333;
            color: #bbbbbb;
        }
        .status {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            text-align: center;
            font-size: 14px;
            color: #666666;
            border-top: 1px solid #111111;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <div style="font-size: 24px; color: #666; text-align: center; grid-column: 1/-1;">Загрузка данных умного дома...</div>
    </div>
    
    <div class="status" id="last-update">Обновление...</div>

    <script>
        // === НАСТРОЙКИ ===
        const OAUTH_TOKEN = 'y0__wgBEIy1shUY8etKIOTQkpsZMKfvmOUHHExXGskE42mj8yucekhmJ9ii--g'; 
        const UPDATE_INTERVAL = 5 * 60 * 1000; // 5 минут

        async function fetchSmartHomeData() {
            try {
                const response = await fetch('https://yandex.net', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${OAUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Ошибка сети или неверный токен');
                
                const data = await response.json();
                renderDashboard(data.devices);
            } catch (error) {
                console.error(error);
                document.getElementById('dashboard').innerHTML = `<div style="color: #ff3333; font-size: 20px; text-align: center; grid-column: 1/-1;">Ошибка: ${error.message}</div>`;
            }
        }

        // Функция для удобного копирования ID при клике
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('ID скопирован в буфер обмена!');
            }).catch(err => {
                console.error('Не удалось скопировать: ', err);
            });
        }

        function renderDashboard(devices) {
            const dashboardEl = document.getElementById('dashboard');
            dashboardEl.innerHTML = ''; 

            // Собираем все сенсоры
            const sensors = devices.filter(device => device.type === 'devices.types.sensor');

            if (sensors.length === 0) {
                dashboardEl.innerHTML = '<div style="color: #888; text-align: center; grid-column: 1/-1;">Датчики температуры не найдены</div>';
                return;
            }

            sensors.forEach(sensor => {
                let temp = '--';
                let humidity = '';
                // Получаем имя комнаты (если не задано, пишем "Без комнаты")
                let roomName = sensor.room_name || 'Без комнаты';

                if (sensor.properties && sensor.properties.length > 0) {
                    sensor.properties.forEach(prop => {
                        if (prop.parameters && prop.parameters.instance === 'temperature') {
                            temp = prop.state ? `${prop.state.value}°` : '--';
                        }
                        if (prop.parameters && prop.parameters.instance === 'humidity') {
                            humidity = prop.state ? `💧 ${prop.state.value}%` : '';
                        }
                    });
                }

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="room-tag">${roomName}</div>
                        <div class="device-name">${sensor.name}</div>
                    </div>
                    <div class="temp-value">${temp}</div>
                    <div class="humidity-value">${humidity}</div>
                    <div class="device-id" onclick="copyToClipboard('${sensor.id}')" title="Кликните, чтобы скопировать">ID: ${sensor.id}</div>
                `;
                dashboardEl.appendChild(card);
            });

            const now = new Date();
            document.getElementById('last-update').innerText = `Обновлено: ${now.toLocaleTimeString()}`;
        }

        fetchSmartHomeData();
        setInterval(fetchSmartHomeData, UPDATE_INTERVAL);
    </script>
</body>
</html>
