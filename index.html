<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home Dashboard</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px 20px 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-y: auto; /* Вертикальный скролл для большого количества датчиков */
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .card {
            background: #121212;
            border: 1px solid #222222;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .room-tag {
            font-size: 14px;
            color: #ffaa00; /* Неоново-оранжевый тег локации */
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .device-name {
            font-size: 24px;
            color: #ffffff;
            font-weight: bold;
        }
        .temp-value {
            font-size: 76px;
            font-weight: bold;
            color: #00ffb3; /* Зеленый цвет для температуры */
            line-height: 1.1;
            margin: 10px 0;
        }
        .humidity-value {
            font-size: 20px;
            color: #00a2ff; /* Синий цвет для влажности */
            margin-bottom: 15px;
        }
        .device-id {
            font-size: 11px;
            color: #555555;
            background: #1a1a1a;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            word-break: break-all;
            transition: background 0.2s;
        }
        .device-id:hover {
            background: #333333;
            color: #bbbbbb;
        }
        .status {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px 0;
            text-align: center;
            font-size: 14px;
            color: #666666;
            border-top: 1px solid #111111;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="container" id="dashboard">
        <div style="font-size: 24px; color: #666; text-align: center; grid-column: 1/-1;">Загрузка данных умного дома...</div>
    </div>
    
    <div class="status" id="last-update">Обновление...</div>

    <script>
        // === НАСТРОЙКИ ТОКЕНА И ОБНОВЛЕНИЯ ===
        const OAUTH_TOKEN = 'y0__wgBEIy1shUY8etKIOTQkpsZMKfvmOUHHExXGskE42mj8yucekhmJ9ii--g'; 
        const UPDATE_INTERVAL = 5 * 60 * 1000; // 5 минут в миллисекундах

        // === РУЧНЫЕ ФИЛЬТРЫ ДАШБОРДА ===
        // Оставить датчики только конкретных домов, например: ['Квартира'] или ['Дача']
        // Если хотите показывать ВСЕ дома, оставьте массив пустым: []
        const FILTER_BY_HOUSES = []; 

        // Оставить только определенные датчики по их ID.
        // Если хотите показывать ВСЕ датчики, оставьте массив пустым: []
        const FILTER_BY_IDS = []; 

        async function fetchSmartHomeData() {
            try {
                const response = await fetch('https://api.iot.yandex.net/v1.0/user/info', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${OAUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Ошибка сети или неверный токен');
                
                const data = await response.json();
                
                // Передаем сырые данные Яндекса на обработку и рендеринг
                processAndRender(data);
            } catch (error) {
                console.error(error);
                document.getElementById('dashboard').innerHTML = `<div style="color: #ff3333; font-size: 20px; text-align: center; grid-column: 1/-1;">Ошибка: ${error.message}</div>`;
            }
        }

        // Функция копирования ID датчика кликом
        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('ID скопирован в буфер обмена!');
            }).catch(err => {
                console.error('Не удалось скопировать: ', err);
            });
        }

        function processAndRender(data) {
            const dashboardEl = document.getElementById('dashboard');
            dashboardEl.innerHTML = ''; 

            // 1. Создаем быстрые словари по эталонной логике Яндекса
            const houseById = {};
            if (data.households) {
                for (const h of data.households) {
                    houseById[h.id] = h.name;
                }
            }

            const roomById = {};
            if (data.rooms) {
                for (const r of data.rooms) {
                    roomById[r.id] = {
                        name: r.name,
                        houseName: houseById[r.household_id] || 'Без дома'
                    };
                }
            }

            // 2. Отбираем и преобразуем датчики
            if (!data.devices) return;

            let sensors = data.devices
                .filter(d => d.type === 'devices.types.sensor')
                .map(d => {
                    const room = roomById[d.room] || { name: 'Без комнаты', houseName: houseById[d.household_id] || 'Без дома' };

                    let temperature = null;
                    let humidity = null;

                    for (const p of (d.properties || [])) {
                        if (p.type === 'devices.properties.float') {
                            if (p.parameters.instance === 'temperature') {
                                temperature = p.state?.value ?? null;
                            }
                            if (p.parameters.instance === 'humidity') {
                                humidity = p.state?.value ?? null;
                            }
                        }
                    }

                    return {
                        id:          d.id,
                        name:        d.name,
                        roomName:    room.name,
                        houseName:   room.houseName,
                        temperature: temperature,
                        humidity:    humidity
                    };
                });

            // 3. Применяем ручные фильтры (если они настроены в секции настроек)
            if (FILTER_BY_IDS.length > 0) {
                sensors = sensors.filter(s => FILTER_BY_IDS.includes(s.id));
            }
            if (FILTER_BY_HOUSES.length > 0) {
                sensors = sensors.filter(s => FILTER_BY_HOUSES.includes(s.houseName));
            }

            if (sensors.length === 0) {
                dashboardEl.innerHTML = '<div style="color: #888; text-align: center; grid-column: 1/-1;">Датчики для отображения не найдены</div>';
                return;
            }

            // 4. Отрисовка готовых карточек умного дома
            sensors.forEach(sensor => {
                const fullLocation = `${sensor.houseName} • ${sensor.roomName}`;
                const tempText = sensor.temperature !== null ? `${sensor.temperature}°` : '--';
                const humText = sensor.humidity !== null ? `💧 ${sensor.humidity}%` : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="room-tag">${fullLocation}</div>
                        <div class="device-name">${sensor.name}</div>
                    </div>
                    <div class="temp-value">${tempText}</div>
                    <div class="humidity-value">${humText}</div>
                    <div class="device-id" onclick="copyToClipboard('${sensor.id}')" title="Кликните, чтобы скопировать">ID: ${sensor.id}</div>
                `;
                dashboardEl.appendChild(card);
            });

            const now = new Date();
            document.getElementById('last-update').innerText = `Обновлено: ${now.toLocaleTimeString()}`;
        }

        // Старт работы
        fetchSmartHomeData();
        setInterval(fetchSmartHomeData, UPDATE_INTERVAL);
    </script>
</body>
</html>
